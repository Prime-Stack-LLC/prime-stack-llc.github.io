<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Stack LLC</title>
    <meta name="description" content="Prime Stack LLC is a software development company based in the United States. We specialize in web development, mobile development, and desktop development.">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        .logo {
            width: 350px;
            height: 100px;
        }
        
        /* Light mode logo (default) */
        .logo-light {
            display: block;
        }
        .logo-dark {
            display: none;
        }
        
        /* Dark mode styles */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #ffffff;
            }
            
            .logo-light {
                display: none;
            }
            .logo-dark {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div>
        <img src="PS-logo-name-350x100.png" alt="Prime Stack LLC" class="logo logo-light">
        <img src="PS-logo-name-white-350x100.png" alt="Prime Stack LLC" class="logo logo-dark">
    </div>
</body>
</html>
